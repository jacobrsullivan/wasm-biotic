name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - r4-source-baseline

permissions:
  contents: read

jobs:
  python-and-record:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --target wasm32-wasip2
      - name: Verify compact release record
        run: ./scripts/verify.sh record
      - name: Verify source import and checkout preflight
        run: ./scripts/verify.sh preflight
      - name: Run release-tool tests
        run: ./scripts/verify.sh python

  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope:
          - format
          - components
          - kernel
          - rust-tools
          - oracle
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --target wasm32-wasip2
      - name: Verify ${{ matrix.scope }}
        run: ./scripts/verify.sh "${{ matrix.scope }}"

  component-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --target wasm32-wasip2
      - name: Install pinned wasm-tools
        run: cargo install wasm-tools --version 1.255.0 --locked
      - name: Build and validate components
        run: ./scripts/verify.sh component-build
