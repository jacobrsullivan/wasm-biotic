[package]
name = "wasm-biotic-capability-router"
description = "Capability-family, authority and approval policy as a Wasm-Biotic component."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
wasm-biotic-service-policy-core = { path = "../service-policy-core" }
wit-bindgen.workspace = true

[dev-dependencies]
ring = "=0.17.14"
wasmtime = { version = "43.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
