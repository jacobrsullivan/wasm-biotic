[workspace]
members = [
    "service-policy-core",
    "capability-router",
    "closure-evaluator",
    "factory-evolution",
    "factory-control",
    "admitted-tool-probe",
    "exchange-service",
    "state-migration",
    "worker-router",
    "services/build",
    "services/packaging",
    "services/validation",
    "services/review",
    "services/continuity",
    "services/scheduling",
    "services/operations",
]
exclude = ["supervisor-reducer", "workers"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dlmalloc = { version = "0.2.12", default-features = false, features = ["global"] }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
wit-bindgen = { version = "0.51.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
