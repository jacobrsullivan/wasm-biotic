[package]
name = "wasm-biotic-state-migration"
description = "Versioned supervisor-state migration policy as a Wasm-Biotic component."
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dlmalloc = { version = "0.2.12", default-features = false, features = ["global"] }
sha2.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }
wit-bindgen = { version = "0.51.0", default-features = false, features = ["macros", "realloc"] }
