[package]
name = "wasm-biotic-independent-substrate"
description = "Independent in-memory reproduction substrate for a signed Wasm-Biotic release."
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ipnet = "=2.12.0"
reqwest = { version = "=0.12.28", default-features = false, features = [
  "blocking",
  "rustls-tls-webpki-roots",
] }
ring = "=0.17.14"
rustls = { version = "=0.23.38", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "=2.5.8"
wasmparser = "=0.246.2"
wasmtime = { version = "=43.0.1", default-features = false, features = [
  "anyhow",
  "component-model",
  "cranelift",
  "runtime",
  "std",
] }
wasm-biotic-service-policy-core = { path = "../../components/service-policy-core", default-features = false }
webpki-roots = "=1.0.7"
