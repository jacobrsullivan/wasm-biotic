[package]
name = "wasm-biotic-kernel"
description = "Policy-neutral native substrate for digest-bound WebAssembly component graphs."
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "wasm_biotic_kernel"
path = "src/lib.rs"

[dependencies]
http = "=1.4.0"
ipnet = "=2.12.0"
ring = "=0.17.14"
rustls = { version = "=0.23.38", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "=2.5.8"
wasmparser = "=0.246.2"
wasmtime = { version = "=43.0.1", default-features = false, features = [
  "anyhow",
  "component-model",
  "cranelift",
  "runtime",
  "std",
] }
webpki-roots = "=1.0.7"

[dev-dependencies]
rcgen = { version = "=0.14.8", default-features = false, features = ["ring"] }
wat = "=1.246.2"
